# Render Blueprint — مجموعة فرجا (Farja Group)
# الاستخدام: Render Dashboard → New → Blueprint → اختر هذا المستودع
# بعد الإنشاء راجع قسم "النشر على Render" في README.md

databases:
  - name: verjar-db
    databaseName: verjar
    user: verjar
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  # ───────── الـ API (Express + Prisma) ─────────
  - type: web
    name: verjar-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server
    # --include=dev لأن prisma و typescript و tsx مطلوبة وقت البناء والتشغيل
    buildCommand: npm ci --include=dev && npm run build
    # يطبّق الـ migrations ثم ينشئ الأدمن والتصنيفات والخدمات إن لم تكن موجودة (آمن للتكرار) ثم يشغّل السيرفر
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: verjar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # رابط الواجهة (للـ CORS) — عدّله إن تغيّر اسم الخدمة أو أضفت دومينًا خاصًا (افصل بفاصلة)
      - key: CLIENT_URL
        value: https://verjar-web.onrender.com
      - key: PUBLIC_API_URL
        value: https://verjar-api.onrender.com
      # الواجهة تمرر /api عبر rewrite فتكون الكوكيز من نفس الدومين
      - key: COOKIE_SAMESITE
        value: lax
      - key: ADMIN_WHATSAPP
        value: "962780192930"
      # حساب الأدمن: يُنشأ عند كل تشغيل إن لم يوجد، وتُحدَّث كلمة مروره إن تغيّرت هنا (farjarweb@gmail.com)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: إدارة مجموعة فرجا
      # لا تُنشأ بيانات تجريبية في الإنتاج
      - key: SEED_DEMO
        value: "false"
      # cloudinary://<api_key>:<api_secret>@<cloud_name> — مطلوب في الإنتاج (قرص Render مؤقت)
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: verjar
      # اختياري: WhatsApp Cloud API من Meta
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_ID
        sync: false
      - key: WA_API_VERSION
        value: v21.0

  # ───────── الواجهة (React + Vite) ─────────
  - type: web
    name: verjar-web
    runtime: static
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # فارغ = الطلبات تذهب إلى /api على نفس الدومين وتُمرَّر للسيرفر عبر rewrite أدناه
      - key: VITE_API_URL
        value: ""
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      # تمرير الـ API للسيرفر (نفس الدومين → كوكيز httpOnly تعمل على كل المتصفحات)
      # عدّل الرابط إن كان اسم خدمة الـ API مختلفًا
      - type: rewrite
        source: /api/*
        destination: https://verjar-api.onrender.com/api/*
      # تطبيق صفحة واحدة: كل المسارات تعرض index.html
      - type: rewrite
        source: /*
        destination: /index.html
